  function renderAccountDocsPanel(acc) {
    const panel = document.createElement('div');
    panel.className = 'account-docs-panel';

    const docs = acc.documents || [];

    // year-by-year breakdown, so older years stay visible even once the
    // headline number next to the account name resets for a new year.
    // Each year also breaks down by quarter where the date is known;
    // older entries logged before quarters were tracked just show as
    // "Unspecified" within that year.
    const totalsByYear = {};
    const quartersByYear = {};
    docs.forEach(d => {
      const y = getDocYear(d);
      totalsByYear[y] = (totalsByYear[y] || 0) + (Number(d.value) || 0);
      const q = getDocQuarter(d);
      const qKey = q ? ('Q' + q) : 'Unspecified';
      if (!quartersByYear[y]) quartersByYear[y] = {};
      quartersByYear[y][qKey] = (quartersByYear[y][qKey] || 0) + (Number(d.value) || 0);
    });
    const years = Object.keys(totalsByYear).map(Number).sort((a, b) => b - a);
    if (years.length && years.some(y => totalsByYear[y] > 0)) {
      const yearsWrap = document.createElement('div');
      yearsWrap.className = 'account-year-totals';
      years.forEach(y => {
        if (totalsByYear[y] <= 0) return;
        const yearBlock = document.createElement('div');
        yearBlock.className = 'account-year-block';

        const yEl = document.createElement('span');
        yEl.className = 'account-year-total';
        yEl.textContent = y + ': ' + formatMoney(totalsByYear[y]);
        yearBlock.appendChild(yEl);

        const qOrder = ['Q1', 'Q2', 'Q3', 'Q4', 'Unspecified'];
        const qParts = qOrder
          .filter(q => quartersByYear[y][q] > 0)
          .map(q => q + ' ' + formatMoney(quartersByYear[y][q]));
        if (qParts.length > 1) {
          const qEl = document.createElement('span');
          qEl.className = 'account-quarter-totals';
          qEl.textContent = qParts.join('  \u00b7  ');
          yearBlock.appendChild(qEl);
        }
        yearsWrap.appendChild(yearBlock);
      });
      panel.appendChild(yearsWrap);
    }

    if (docs.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'account-docs-empty';
      empty.textContent = 'Nothing saved yet. Paste a link to a proposal, deck, or anything else worth keeping handy for this account.';
      panel.appendChild(empty);
    } else {
      docs.slice().sort((a, b) => (b.year || 0) - (a.year || 0)).forEach(doc => {
        panel.appendChild(renderDocItem(acc, doc));
      });
    }

    const addRow = document.createElement('div');
    addRow.className = 'account-doc-add-row';
    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.placeholder = 'Project name, e.g. MI Gap Analysis';
    const urlInput = document.createElement('input');
    urlInput.type = 'text';
    urlInput.placeholder = 'SharePoint, Teams, or Drive link';
    const valueInput = document.createElement('input');
    valueInput.type = 'text';
    valueInput.inputMode = 'decimal';
    valueInput.placeholder = 'Value (optional), e.g. 25000';
    addRow.appendChild(titleInput);
    addRow.appendChild(urlInput);
    addRow.appendChild(valueInput);
    panel.appendChild(addRow);

    // Which quarter/year this project counts toward, separate from when
    // it's actually being logged, since work often starts well ahead of
    // the quarter it's really for.
    const nowYear = new Date().getFullYear();
    const periodRow = document.createElement('div');
    periodRow.className = 'account-doc-period-row';

    const quarterGroup = document.createElement('div');
    quarterGroup.className = 'btn-group account-doc-quarter-group';
    let selectedQuarter = currentQuarter();
    [1, 2, 3, 4].forEach(qn => {
      const qBtn = document.createElement('button');
      qBtn.type = 'button';
      qBtn.className = 'btn-group-option account-doc-quarter-btn' + (qn === selectedQuarter ? ' active' : '');
      qBtn.textContent = 'Q' + qn;
      qBtn.onclick = () => {
        selectedQuarter = qn;
        quarterGroup.querySelectorAll('.account-doc-quarter-btn').forEach(b => b.classList.remove('active'));
        qBtn.classList.add('active');
      };
      quarterGroup.appendChild(qBtn);
    });
    periodRow.appendChild(quarterGroup);

    const yearSelect = document.createElement('input');
    yearSelect.type = 'text';
    yearSelect.inputMode = 'numeric';
    yearSelect.maxLength = 4;
    yearSelect.className = 'account-doc-year-select';
    yearSelect.value = nowYear;
    periodRow.appendChild(yearSelect);
    panel.appendChild(periodRow);

    const addDocBtn = document.createElement('button');
    addDocBtn.className = 'account-doc-add-btn';
    addDocBtn.textContent = 'Add project';
    addDocBtn.onclick = async () => {
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      const title = titleInput.value.trim() || url;
      const rawValue = valueInput.value.replace(/[^0-9.]/g, '');
      const value = rawValue ? parseFloat(rawValue) : 0;
      if (!acc.documents) acc.documents = [];
      acc.documents.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title,
        url: url,
        value: value,
        year: parseYearInput(yearSelect.value),
        quarter: selectedQuarter,
        loggedAt: isoDate(new Date())
      });
      titleInput.value = '';
      urlInput.value = '';
      valueInput.value = '';
      touchAccountActivity(acc);
      await saveAccounts();
      renderAccountsList();
    };
    panel.appendChild(addDocBtn);

    const remindersRow = document.createElement('div');
    remindersRow.className = 'account-reminders-row';
    const remindersOn = acc.remindersEnabled !== false;
    const remindersToggle = document.createElement('button');
    remindersToggle.type = 'button';
    remindersToggle.className = 'account-reminders-toggle' + (remindersOn ? '' : ' off');
    remindersToggle.textContent = remindersOn ? 'Check-in reminders: On' : 'Check-in reminders: Off';
    remindersToggle.onclick = async () => {
      acc.remindersEnabled = !remindersOn;
      await saveAccounts();
      renderAccountsList();
    };
    remindersRow.appendChild(remindersToggle);
    panel.appendChild(remindersRow);

    return panel;
  }

  function startSync() {
    if (!firestoreReady || !taskDocRef) {
      setSyncStatus('offline');
      return;
    }
    // Sign in anonymously first. This doesn't ask the person for anything,
    // it just gets a token from Firebase so the security rules can tell
    // "this app" apart from a random script hitting the database directly.
    firebase.auth().signInAnonymously().catch(() => {
      setSyncStatus('offline');
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;
      taskDocRef.onSnapshot(
        (docSnap) => {
          if (suppressNextSnapshotRender) {
            suppressNextSnapshotRender = false;
            setSyncStatus('online');
            return;
          }
          if (docSnap.exists) {
            const data = docSnap.data();
            tasks = data.tasks ? JSON.parse(data.tasks) : [];
            if (data.collapsedAccounts) {
              collapsedAccounts = new Set(JSON.parse(data.collapsedAccounts));
              localAdapter.set('collapsedAccounts', data.collapsedAccounts);
            }
          } else {
            tasks = [];
          }
          localAdapter.set('tasks', JSON.stringify(tasks));
          const moved = rollOverdueForward();
          if (moved > 0) saveTasks();
          setSyncStatus('online');
          render();
        },
        (error) => {
          setSyncStatus('offline');
        }
      );
    });
  }


  function rollOverdueForward() {
    let moved = 0;
    tasks.forEach(t => {
      if (!t.completed && t.week < todayWeek) {
        t.week = todayWeek;
        t.rolledOver = true;
        moved++;
      }
    });
    return moved;
  }

  function addTask(text, week, rolledOver, account, priority, stakeholder, type, dueDate) {
    const resolvedWeek = dueDate ? isoDate(mondayOf(new Date(dueDate + 'T00:00:00'))) : (week || viewedWeek);
    const t = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: text.trim(),
      week: resolvedWeek,
      completed: false,
      completedAt: null,
      rolledOver: !!rolledOver,
      account: account ? account.trim() : '',
      stakeholder: stakeholder ? stakeholder.trim() : '',
      priority: priority || '',
      type: type || '',
      dueDate: dueDate || '',
      comment: ''
    };
    tasks.push(t);
    return t;
  }

  function render() {
    weekLabel.textContent = 'Week of ' + fmtRange(viewedWeek);
    if (weekNavLabel) {
      weekNavLabel.textContent = viewedWeek === todayWeek ? 'This week' : fmtRange(viewedWeek);
    }
    if (todayBtn) {
      todayBtn.style.display = viewedWeek === todayWeek ? 'none' : 'inline-block';
    }
    if (pageTitle) {
      pageTitle.textContent = viewedWeek === todayWeek ? "This week's tasks"
        : viewedWeek > todayWeek ? "Upcoming tasks" : "Past tasks";
    }

    const thisWeekTasks = tasks.filter(t => t.week === viewedWeek);
    const openCount = thisWeekTasks.filter(t => !t.completed);
    const highCount = openCount.filter(t => t.priority === 'high').length;
    const medCount = openCount.filter(t => t.priority === 'medium').length;
    const lowCount = openCount.filter(t => t.priority === 'low').length;
    if (openCount.length === 0) {
      weekSummary.textContent = '';
    } else {
      weekSummary.innerHTML = openCount.length + ' open'
        + (highCount ? ' &middot; <span class="count-high">' + highCount + ' high</span>' : '')
        + (medCount ? ' &middot; <span class="count-medium">' + medCount + ' medium</span>' : '')
        + (lowCount ? ' &middot; <span class="count-low">' + lowCount + ' low</span>' : '');
    }

    // build account filter options from this week's active accounts,
    // treating different capitalizations of the same name as one account
    const accountDisplayByKey = new Map();
    thisWeekTasks.filter(t => !t.completed && t.account).forEach(t => {
      const key = accountKey(t.account);
      if (!accountDisplayByKey.has(key)) accountDisplayByKey.set(key, t.account.trim());
    });
    const accounts = Array.from(accountDisplayByKey.values()).sort((a, b) => a.localeCompare(b));
    const matchingDisplay = accounts.find(a => accountKey(a) === accountKey(activeAccountFilter));
    activeAccountFilter = matchingDisplay || '';
    accountFilter.innerHTML = '<option value="">All accounts</option>' +
      accounts.map(a => '<option value="' + escapeAttr(a) + '">' + escapeHtml(a) + '</option>').join('');
    accountFilter.value = activeAccountFilter;
    priorityFilter.value = activePriorityFilter;
    filterRow.style.display = thisWeekTasks.some(t => !t.completed) ? 'block' : 'none';

    let active = thisWeekTasks.filter(t => !t.completed);
    if (activeAccountFilter) {
      active = active.filter(t => accountKey(t.account) === accountKey(activeAccountFilter));
    }
    if (activePriorityFilter) {
      active = active.filter(t =>
        activePriorityFilter === 'none' ? !t.priority : t.priority === activePriorityFilter
      );
    }
    const prioOrder = { high: 0, medium: 1, low: 2 };
    active = active.slice().sort((a, b) => {
      const pa = a.priority ? prioOrder[a.priority] : 3;
      const pb = b.priority ? prioOrder[b.priority] : 3;
      if (pa !== pb) return pa - pb;
      return (a.dueDate || '9999').localeCompare(b.dueDate || '9999');
    });
    const done = thisWeekTasks.filter(t => t.completed);

    listEl.innerHTML = '';
    if (active.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = activeAccountFilter
        ? 'Nothing open for this account.'
        : 'Nothing on the list. Add something above.';
      listEl.appendChild(empty);
    } else if (activeAccountFilter) {
      // Already narrowed to one account via the filter, no need to group.
      active.forEach(t => listEl.appendChild(renderTask(t)));
    } else {
      const groups = {};
      const unassigned = [];
      active.forEach(t => {
        if (t.account) {
          const key = accountKey(t.account);
          if (!groups[key]) groups[key] = { display: t.account.trim(), tasks: [] };
          groups[key].tasks.push(t);
        } else {
          unassigned.push(t);
        }
      });
      const groupKeys = Object.keys(groups).sort((a, b) => groups[a].display.localeCompare(groups[b].display));
      groupKeys.forEach(key => {
        listEl.appendChild(renderAccountGroup(groups[key].display, groups[key].tasks, key));
      });
      if (unassigned.length) {
        if (groupKeys.length) {
          const label = document.createElement('p');
          label.className = 'unassigned-label';
          label.textContent = 'No account';
          listEl.appendChild(label);
        }
        unassigned.forEach(t => listEl.appendChild(renderTask(t)));
      }
    }

    renderHistory();
  }

  // Treats account names as the same account regardless of capitalization
  // or stray spacing ("Agilent Tech" == "agilent tech" == " Agilent Tech ").
  function accountKey(name) {
    return (name || '').trim().toLowerCase();
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
  }

  let historyWeekCollapseOverride = new Map();

  function renderHistory() {
    const q = (historySearch && historySearch.value || '').trim().toLowerCase();
    let completed = tasks.filter(t => t.completed);
    historyResults.innerHTML = '';

    if (completed.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'history-empty';
      hint.textContent = 'Nothing completed yet.';
      historyResults.appendChild(hint);
      return;
    }

    if (q) {
      completed = completed.filter(t =>
        (t.account || '').toLowerCase().includes(q) ||
        (t.stakeholder || '').toLowerCase().includes(q) ||
        t.text.toLowerCase().includes(q)
      );
    }

    if (completed.length === 0) {
      const none = document.createElement('div');
      none.className = 'history-empty';
      none.textContent = 'No completed tasks match that.';
      historyResults.appendChild(none);
      return;
    }

    // Grouped by week, most recent first. The 3 most recent weeks are
    // always shown in full, no click needed, since that's the stuff most
    // worth seeing at a glance. Anything older tucks behind a per-week
    // toggle so the page doesn't turn into an endless scroll.
    const weeks = Array.from(new Set(completed.map(t => t.week))).sort((a, b) => b.localeCompare(a));

    weeks.forEach((week, index) => {
      const weekTasks = completed
        .filter(t => t.week === week)
        .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));

      const defaultCollapsed = index >= 3;
      const isCollapsed = historyWeekCollapseOverride.has(week)
        ? historyWeekCollapseOverride.get(week)
        : defaultCollapsed;

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'history-week-header' + (isCollapsed ? ' collapsed' : '');
      header.textContent = 'Week of ' + fmtRange(week) + ' \u00b7 ' + weekTasks.length + (weekTasks.length === 1 ? ' task' : ' tasks');
      header.onclick = () => {
        historyWeekCollapseOverride.set(week, !isCollapsed);
        renderHistory();
      };
      historyResults.appendChild(header);

      if (!isCollapsed) {
        // Sub-group by account within the week, lighter treatment than the
        // open-task account cards since this is meant to stay a quick scan.
        const groups = {};
        const unassigned = [];
        weekTasks.forEach(t => {
          if (t.account) {
            const key = accountKey(t.account);
            if (!groups[key]) groups[key] = { display: t.account.trim(), tasks: [] };
            groups[key].tasks.push(t);
          } else {
            unassigned.push(t);
          }
        });
        const groupKeys = Object.keys(groups).sort((a, b) => groups[a].display.localeCompare(groups[b].display));
        groupKeys.forEach(key => {
          const sub = document.createElement('p');
          sub.className = 'history-account-subheader';
          sub.textContent = groups[key].display;
          historyResults.appendChild(sub);
          groups[key].tasks.forEach(t => historyResults.appendChild(renderHistoryItem(t)));
        });
        if (unassigned.length) {
          if (groupKeys.length) {
            const sub = document.createElement('p');
            sub.className = 'history-account-subheader';
            sub.textContent = 'No account';
            historyResults.appendChild(sub);
          }
          unassigned.forEach(t => historyResults.appendChild(renderHistoryItem(t)));
        }
      }
    });
  }

  function renderHistoryItem(t) {
    const item = document.createElement('div');
    item.className = 'history-item';
    const text = document.createElement('div');
    text.className = 'task-text';
    text.textContent = t.text;
    item.appendChild(text);

    const tags = document.createElement('div');
    tags.className = 'task-tags';
    if (t.priority) {
      const prioTag = document.createElement('span');
      prioTag.className = 'prio-tag prio-' + t.priority;
      prioTag.textContent = t.priority;
      tags.appendChild(prioTag);
    }
    if (t.type) {
      const typeTag = document.createElement('span');
      typeTag.className = 'type-tag type-' + t.type;
      typeTag.textContent = t.type === 'external' ? 'External' : 'Internal';
      tags.appendChild(typeTag);
    }
    if (t.stakeholder) {
      const stakeTag = document.createElement('span');
      stakeTag.className = 'stakeholder-tag';
      stakeTag.textContent = t.stakeholder;
      tags.appendChild(stakeTag);
    }
    if (t.dueDate) {
      const dueTag = document.createElement('span');
      dueTag.className = 'due-tag';
      dueTag.textContent = 'Was due ' + new Date(t.dueDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      tags.appendChild(dueTag);
    }
    item.appendChild(tags);

    if (t.comment) {
      const commentEl = document.createElement('div');
      commentEl.className = 'task-comment-text';
      commentEl.style.marginTop = '6px';
      commentEl.style.cursor = 'default';
      commentEl.textContent = t.comment;
      item.appendChild(commentEl);
    }

    const dateEl = document.createElement('div');
    dateEl.className = 'history-date';
    dateEl.textContent = t.completedAt
      ? 'Completed ' + new Date(t.completedAt + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : 'Completion date not recorded';
    item.appendChild(dateEl);

    const actionsRow = document.createElement('div');
    actionsRow.className = 'history-actions';

    const reopen = document.createElement('button');
    reopen.className = 'history-reopen';
    reopen.textContent = 'Reopen onto this week';
    reopen.onclick = async () => {
      t.completed = false;
      t.completedAt = null;
      t.week = todayWeek;
      await saveTasks();
      render();
    };
    actionsRow.appendChild(reopen);

    const del = document.createElement('button');
    del.className = 'history-del';
    del.textContent = 'Delete';
    del.onclick = async () => {
      tasks = tasks.filter(x => x.id !== t.id);
      await saveTasks();
      render();
    };
    actionsRow.appendChild(del);

    item.appendChild(actionsRow);

    return item;
  }

  function renderAccountGroup(accountName, tasksArr, groupKey) {
    const key = groupKey || accountKey(accountName);
    const wrap = document.createElement('div');
    wrap.className = 'account-group';

    const collapsed = collapsedAccounts.has(key);

    const header = document.createElement('div');
    header.className = 'account-group-header' + (collapsed ? ' collapsed' : '');

    const nameEl = document.createElement('span');
    nameEl.className = 'account-group-name';
    const trackedAccount = activeAccounts().find(a => accountKey(a.name) === key);
    if (trackedAccount && trackedAccount.status) {
      const dot = document.createElement('span');
      dot.className = 'account-status-dot';
      dot.style.background = 'var(--status-' + trackedAccount.status + ')';
      dot.title = trackedAccount.status.charAt(0).toUpperCase() + trackedAccount.status.slice(1);
      nameEl.appendChild(dot);
    }
    nameEl.appendChild(document.createTextNode(accountName));

    const countEl = document.createElement('span');
    countEl.className = 'account-group-count';
    countEl.textContent = tasksArr.length + (tasksArr.length === 1 ? ' task' : ' tasks');

    const caret = document.createElement('span');
    caret.className = 'account-group-caret';
    caret.textContent = collapsed ? '\u25b8' : '\u25be';

    header.appendChild(nameEl);
    header.appendChild(countEl);
    header.appendChild(caret);
    header.onclick = () => {
      if (collapsedAccounts.has(key)) {
        collapsedAccounts.delete(key);
      } else {
        collapsedAccounts.add(key);
      }
      render();
      saveTasks();
    };
    wrap.appendChild(header);

    if (!collapsed) {
      const body = document.createElement('div');
      body.className = 'account-group-body';
      tasksArr.forEach(t => body.appendChild(renderTask(t, true)));
      wrap.appendChild(body);
    }

    return wrap;
  }

  function renderTask(t, hideAccountTag) {
    const wrap = document.createElement('div');

    const priority = t.priority || '';
    const row = document.createElement('div');
    row.className = 'task' + (priority ? ' prio-' + priority : '') + (t.completed ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'check';
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
    check.onclick = () => onToggle(t);

    const body = document.createElement('div');
    body.className = 'task-body';
    const text = document.createElement('div');
    text.className = 'task-text';
    text.textContent = t.text;
    body.appendChild(text);

    const tags = document.createElement('div');
    tags.className = 'task-tags';
    if (priority) {
      const prioTag = document.createElement('span');
      prioTag.className = 'prio-tag prio-' + priority;
      prioTag.textContent = priority;
      tags.appendChild(prioTag);
    }
    if (t.type) {
      const typeTag = document.createElement('span');
      typeTag.className = 'type-tag type-' + t.type;
      typeTag.textContent = t.type === 'external' ? 'External' : 'Internal';
      tags.appendChild(typeTag);
    }
    if (t.account && !hideAccountTag) {
      const acctTag = document.createElement('span');
      acctTag.className = 'account-tag';
      acctTag.textContent = t.account;
      tags.appendChild(acctTag);
    }
    if (t.stakeholder) {
      const stakeTag = document.createElement('span');
      stakeTag.className = 'stakeholder-tag';
      stakeTag.textContent = t.stakeholder;
      tags.appendChild(stakeTag);
    }
    if (t.dueDate) {
      const dueTag = document.createElement('span');
      const isOverdue = !t.completed && t.dueDate < isoDate(new Date());
      dueTag.className = 'due-tag' + (isOverdue ? ' overdue' : '');
      dueTag.textContent = 'Due ' + new Date(t.dueDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      tags.appendChild(dueTag);
    }
    body.appendChild(tags);

    if (t.rolledOver && !t.completed) {
      const meta = document.createElement('div');
      meta.className = 'task-meta';
      meta.textContent = 'Carried over from last week';
      body.appendChild(meta);
    }

    const commentWrap = document.createElement('div');
    commentWrap.className = 'task-comment-wrap';

    if (pendingCommentEdit === t.id) {
      const textarea = document.createElement('textarea');
      textarea.className = 'task-comment-input';
      textarea.value = t.comment || '';
      textarea.placeholder = 'e.g. Sent to legal 8/25, waiting on their signature';
      commentWrap.appendChild(textarea);

      const btnRow = document.createElement('div');
      btnRow.className = 'task-comment-btns';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'task-comment-save';
      saveBtn.textContent = 'Save';
      saveBtn.onclick = async () => {
        t.comment = textarea.value.trim();
        pendingCommentEdit = null;
        await saveTasks();
        render();
      };
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'task-comment-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => {
        pendingCommentEdit = null;
        render();
      };
      btnRow.appendChild(saveBtn);
      btnRow.appendChild(cancelBtn);
      commentWrap.appendChild(btnRow);
      body.appendChild(commentWrap);
      setTimeout(() => textarea.focus(), 0);
    } else if (t.comment) {
      const commentText = document.createElement('div');
      commentText.className = 'task-comment-text';
      commentText.textContent = t.comment;
      commentText.title = 'Tap to edit';
      commentText.onclick = () => { pendingCommentEdit = t.id; render(); };
      commentWrap.appendChild(commentText);
      body.appendChild(commentWrap);
    } else {
      const addLink = document.createElement('button');
      addLink.className = 'task-comment-add';
      addLink.textContent = '+ Add comment';
      addLink.onclick = () => { pendingCommentEdit = t.id; render(); };
      commentWrap.appendChild(addLink);
      body.appendChild(commentWrap);
    }

    const actions = document.createElement('div');
    actions.className = 'task-actions';

    if (t.completed) {
      const undo = document.createElement('button');
      undo.className = 'task-undo';
      undo.textContent = 'Undo';
      undo.onclick = () => onToggle(t);
      actions.appendChild(undo);
    } else {
      const push = document.createElement('button');
      push.className = 'task-undo';
      push.title = 'Push to next week without marking it done';
      push.textContent = '\u2192 Next wk';
      push.onclick = async () => {
        const nextMonday = new Date(t.week + 'T00:00:00');
        nextMonday.setDate(nextMonday.getDate() + 7);
        t.week = isoDate(nextMonday);
        t.rolledOver = false;
        await saveTasks();
        render();
      };
      actions.appendChild(push);
    }

    const del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = '\u00d7';
    del.onclick = () => onDelete(t);
    actions.appendChild(del);

    row.appendChild(check);
    row.appendChild(body);
    row.appendChild(actions);
    wrap.appendChild(row);

    return wrap;
  }

  async function onToggle(t) {
    t.completed = !t.completed;
    t.completedAt = t.completed ? isoDate(new Date()) : null;
    await saveTasks();
    render();
  }

  async function onDelete(t) {
    tasks = tasks.filter(x => x.id !== t.id);
    await saveTasks();
    render();
  }

  addBtn.onclick = async () => {
    if (input.value.trim()) {
      addTask(input.value, viewedWeek, false, accountInput.value, prioritySelect.value, stakeholderInput.value, typeSelect.value, resolveDueDate());
      input.value = '';
      accountInput.value = '';
      stakeholderInput.value = '';
      dueMonthInput.value = '';
      dueDayInput.value = '';
      setPriorityValue('');
      setTypeValue('');
      await saveTasks();
      render();
      input.focus();
    }
  };
  input.onkeydown = (e) => { if (e.key === 'Enter') addBtn.click(); };
  accountInput.onkeydown = (e) => { if (e.key === 'Enter') addBtn.click(); };
  stakeholderInput.onkeydown = (e) => { if (e.key === 'Enter') addBtn.click(); };

  accountFilter.onchange = () => {
    activeAccountFilter = accountFilter.value;
    render();
  };

  priorityFilter.onchange = () => {
    activePriorityFilter = priorityFilter.value;
    render();
  };

  if (historySearch) {
    historySearch.oninput = () => renderHistory();
  }

  prevWeekBtn.onclick = () => {
    const d = new Date(viewedWeek + 'T00:00:00');
    d.setDate(d.getDate() - 7);
    viewedWeek = isoDate(d);
    render();
  };

  nextWeekBtn.onclick = () => {
    const d = new Date(viewedWeek + 'T00:00:00');
    d.setDate(d.getDate() + 7);
    viewedWeek = isoDate(d);
    render();
  };

  todayBtn.onclick = () => {
    viewedWeek = todayWeek;
    render();
  };

  exportBtn.onclick = () => {
    const payload = {
      exportedAt: new Date().toISOString(),
      tasks: tasks
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'task-tracker-backup-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusMsg.textContent = 'Backup downloaded. Load it into an updated version with Import.';
  };

  importBtn.onclick = () => importFile.click();

  const exportAccountsBtn = document.getElementById('exportAccountsBtn');
  if (exportAccountsBtn) {
    exportAccountsBtn.onclick = () => {
      const currentYear = new Date().getFullYear();

      const summaryRows = [['Account', 'Status', 'YTD Value', 'All-Time Value', 'Projects']];
      const projectRows = [['Account', 'Status', 'Project', 'Value', 'Quarter', 'Year', 'Link']];

      accountsList.forEach(acc => {
        if (acc.deleted) return;
        const ytd = accountYearTotal(acc, currentYear);
        const allTime = (acc.documents || []).reduce((sum, d) => sum + (Number(d.value) || 0), 0);
        const docCount = (acc.documents || []).length;
        summaryRows.push([acc.name, acc.status || '', ytd, allTime, docCount]);

        (acc.documents || []).forEach(doc => {
          const q = getDocQuarter(doc);
          projectRows.push([
            acc.name,
            acc.status || '',
            doc.title || '',
            Number(doc.value) || 0,
            q ? ('Q' + q) : '',
            getDocYear(doc),
            doc.url || ''
          ]);
        });
      });

      const wb = XLSX.utils.book_new();
      const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
      const projectSheet = XLSX.utils.aoa_to_sheet(projectRows);
      XLSX.utils.book_append_sheet(wb, summarySheet, 'Accounts');
      XLSX.utils.book_append_sheet(wb, projectSheet, 'Projects');
      XLSX.writeFile(wb, 'accounts-' + isoDate(new Date()) + '.xlsx');
    };
  }

  // Quarter report: filter every project across every account down to one
  // quarter and year, export as its own spreadsheet.
  const reportQuarterGroup = document.getElementById('reportQuarterGroup');
  const reportYearSelect = document.getElementById('reportYearSelect');
  const exportQuarterReportBtn = document.getElementById('exportQuarterReportBtn');

  if (reportQuarterGroup && reportYearSelect && exportQuarterReportBtn) {
    reportYearSelect.value = new Date().getFullYear();

    let selectedReportQuarter = currentQuarter();
    const quarterBtns = reportQuarterGroup.querySelectorAll('.report-quarter-btn');
    quarterBtns.forEach(b => {
      if (parseInt(b.dataset.value, 10) === selectedReportQuarter) b.classList.add('active');
      b.onclick = () => {
        selectedReportQuarter = parseInt(b.dataset.value, 10);
        quarterBtns.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      };
    });

    exportQuarterReportBtn.onclick = () => {
      const year = parseYearInput(reportYearSelect.value);
      const rows = [['Account', 'Project', 'Value', 'Link', 'Quarter', 'Year']];
      accountsList.forEach(acc => {
        if (acc.deleted) return;
        (acc.documents || []).forEach(doc => {
          if (getDocYear(doc) === year && getDocQuarter(doc) === selectedReportQuarter) {
            const escapedAccount = '"' + acc.name.replace(/"/g, '""') + '"';
            const escapedTitle = '"' + (doc.title || '').replace(/"/g, '""') + '"';
            const escapedUrl = '"' + (doc.url || '').replace(/"/g, '""') + '"';
            rows.push([escapedAccount, escapedTitle, Number(doc.value) || 0, escapedUrl, 'Q' + selectedReportQuarter, year]);
          }
        });
      });
      if (rows.length === 1) {
        statusMsg.textContent = 'No projects found for Q' + selectedReportQuarter + ' ' + year + '.';
        return;
      }
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Q' + selectedReportQuarter + '-' + year + '-report.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
  }


  importFile.onchange = async () => {
    const file = importFile.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const incoming = Array.isArray(parsed) ? parsed : parsed.tasks;
      if (!Array.isArray(incoming)) throw new Error('bad format');

      const existingIds = new Set(tasks.map(t => t.id));
      let added = 0;
      incoming.forEach(t => {
        if (t && t.id && !existingIds.has(t.id)) {
          tasks.push(t);
          existingIds.add(t.id);
          added++;
        }
      });
      rollOverdueForward();
      await saveTasks();
      render();
      statusMsg.textContent = added > 0
        ? 'Added ' + added + ' task' + (added === 1 ? '' : 's') + ' from the backup.'
        : 'That backup did not have any tasks not already here.';
    } catch (e) {
      statusMsg.textContent = 'Could not read that file. Make sure it is a backup exported from this app.';
    }
    importFile.value = '';
  };

  if (notesArea) {
    notesArea.addEventListener('input', scheduleNotesSave);
  }

  const newAccountTrackerInput = document.getElementById('newAccountTrackerInput');
  const accountStatusBtnGroup = document.getElementById('accountStatusBtnGroup');
  const newAccountTrackerStatus = document.getElementById('newAccountTrackerStatus');
  const addAccountTrackerBtn = document.getElementById('addAccountTrackerBtn');

  function setAccountTrackerStatus(v) {
    newAccountTrackerStatus.value = v;
    accountStatusBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
      b.classList.toggle('active', b.dataset.value === v);
    });
  }
  accountStatusBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
    b.onclick = () => setAccountTrackerStatus(newAccountTrackerStatus.value === b.dataset.value ? '' : b.dataset.value);
  });
  setAccountTrackerStatus('working');

  addAccountTrackerBtn.onclick = async () => {
    const name = newAccountTrackerInput.value.trim();
    if (!name) return;
    const key = accountKey(name);
    const existing = activeAccounts().find(a => accountKey(a.name) === key);
    if (existing) {
      existing.status = newAccountTrackerStatus.value;
      touchAccountActivity(existing);
    } else {
      accountsList.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: name,
        status: newAccountTrackerStatus.value,
        documents: [],
        lastActivityAt: isoDate(new Date()),
        staleDismissed: false,
        remindersEnabled: true
      });
    }
    newAccountTrackerInput.value = '';
    setAccountTrackerStatus('working');
    await saveAccounts();
    renderAccountsList();
    render();
  };
  newAccountTrackerInput.onkeydown = (e) => { if (e.key === 'Enter') addAccountTrackerBtn.click(); };

  const accountSearchInput = document.getElementById('accountSearchInput');
  if (accountSearchInput) {
    accountSearchInput.addEventListener('input', renderAccountsList);
  }

  (async function init() {
    await loadTasks();
    const moved = rollOverdueForward();
    render();
    startSync();
    if (moved > 0) await saveTasks();
    await loadNotes();
    startNotesSync();
    await loadAccounts();
    renderAccountsList();
    startAccountsSync();
  })();
})();
</script>
</body>
</html>
