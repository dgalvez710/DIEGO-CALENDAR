<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Task Tracker</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --panel-border: #2b2f38;
    --text: #e8e9ec;
    --text-dim: #8b909c;
    --accent: #4f8a6f;
    --accent-dim: #35473f;
    --danger: #b5544a;
    --overdue: #c9955a;
    --high: #c9564a;
    --medium: #c9955a;
    --low: #5a8fc9;
    --internal-color: #3fa0b5;
    --external-color: #9a7fc9;
    --status-won: #4caf82;
    --status-working: #ccb02e;
    --status-lost: #b5544a;
    --status-stalled: #8b909c;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .header-actions button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .header-actions button:hover { color: var(--text); border-color: var(--accent); }
  .week-label {
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    margin: 0;
  }
  .week-summary {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 10px 0 0;
  }
  .week-summary .count-high { color: var(--high); }
  .week-summary .count-medium { color: var(--medium); }
  .week-summary .count-low { color: var(--low); }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .week-nav button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
  }
  .week-nav button:hover { color: var(--text); border-color: var(--accent); }
  #prevWeekBtn, #nextWeekBtn {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    padding: 0;
    font-size: 16px;
  }
  .week-nav-label {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
  }
  #todayBtn {
    padding: 5px 10px;
    flex-shrink: 0;
  }

  .add-form {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 22px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .add-row:last-child { margin-bottom: 0; }
  .add-form input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 15px;
    min-width: 0;
  }
  .add-form input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-form select {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 0 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .add-form button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #addBtn {
    flex: 1;
    min-width: 90px;
    width: 100%;
    padding: 13px 18px;
  }
  #newTypeSelect {
    width: auto;
    flex: 1;
    min-width: 110px;
  }
  .add-form button:active { opacity: 0.85; }

  .btn-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-group-option {
    flex: 1;
    min-width: 44px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 9px 6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
  }
  .btn-group-option.active {
    color: #fff;
    border-color: transparent;
    font-weight: 700;
  }

  /* Bubble always shows its color, dim when unselected, solid + a light
     ring when selected, so the color itself is always readable, not just
     the outline. */
  .btn-group-option.prio-high,
  .btn-group-option.prio-medium,
  .btn-group-option.prio-low,
  .btn-group-option.type-internal,
  .btn-group-option.type-external,
  .btn-group-option.status-won,
  .btn-group-option.status-working,
  .btn-group-option.status-lost,
  .btn-group-option.status-stalled {
    color: #fff;
    border-color: transparent;
    opacity: 0.5;
  }
  .btn-group-option.prio-high { background: var(--high); }
  .btn-group-option.prio-medium { background: var(--medium); }
  .btn-group-option.prio-low { background: var(--low); }
  .btn-group-option.type-internal { background: var(--internal-color); }
  .btn-group-option.type-external { background: var(--external-color); }
  .btn-group-option.status-won { background: var(--status-won); }
  .btn-group-option.status-working { background: var(--status-working); }
  .btn-group-option.status-lost { background: var(--status-lost); }
  .btn-group-option.status-stalled { background: var(--status-stalled); }

  .btn-group-option.prio-high.active,
  .btn-group-option.prio-medium.active,
  .btn-group-option.prio-low.active,
  .btn-group-option.type-internal.active,
  .btn-group-option.type-external.active,
  .btn-group-option.status-won.active,
  .btn-group-option.status-working.active,
  .btn-group-option.status-lost.active,
  .btn-group-option.status-stalled.active {
    opacity: 1;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55) inset;
  }
  .btn-group-option:not(.active):hover { opacity: 0.75; }

  .account-tracker-section {
    margin-top: 22px;
  }
  .account-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .account-section-header button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .account-section-header button:hover { color: var(--text); border-color: var(--accent); }
  .pipeline-dashboard {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .pipeline-stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .pipeline-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  .pipeline-stat-value {
    font-size: 17px;
    font-weight: 700;
  }
  .pipeline-stat-value.won { color: var(--status-won); }
  .pipeline-stat-value.working { color: var(--status-working); }
  .pipeline-stat-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .quarter-report-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 14px;
  }
  .quarter-report-label {
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  #reportQuarterGroup {
    flex: 1;
    min-width: 140px;
    gap: 4px;
  }
  .report-quarter-btn {
    flex: 1;
    min-width: 34px;
    padding: 6px 4px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
  }
  .report-quarter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
    font-weight: 700;
  }
  #exportQuarterReportBtn {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .account-add-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .account-search-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .account-search-input:focus { outline: none; border-color: var(--accent); }

  .deleted-accounts-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 0;
    margin-top: 6px;
  }
  .deleted-accounts-toggle:hover { color: var(--text); }
  .deleted-accounts-list {
    margin-top: 6px;
  }
  .deleted-account-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    opacity: 0.85;
  }
  .deleted-account-info { flex: 1; min-width: 0; }
  .deleted-account-name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .deleted-account-sub {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .deleted-account-restore {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .account-add-row input[type="text"] {
    flex: 1;
    min-width: 140px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  .account-add-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .account-add-row .btn-group { flex: 1 1 100%; }
  #addAccountTrackerBtn {
    flex: 1 1 100%;
    padding: 10px;
  }
  .account-track-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 4px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .account-track-item.status-won { border-left-color: var(--status-won); }
  .account-track-item.status-working { border-left-color: var(--status-working); }
  .account-track-item.status-lost { border-left-color: var(--status-lost); }
  .account-track-item.status-stalled { border-left-color: var(--status-stalled); }
  .account-track-name {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account-track-value-row {
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 12px 0;
  }
  .account-stale-badge {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--status-working);
    color: #1a1400;
    border: none;
    font-size: 12px;
    font-weight: 800;
    line-height: 20px;
    padding: 0;
    cursor: pointer;
    text-align: center;
  }
  .account-stale-badge:hover { filter: brightness(1.15); }
  .account-reminders-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-border);
  }
  .account-reminders-toggle {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
  }
  .account-reminders-toggle:hover { color: var(--text); border-color: var(--accent); }
  .account-reminders-toggle.off { color: var(--text-dim); opacity: 0.6; }
  .account-track-item .btn-group {
    flex-shrink: 0;
    width: auto;
    gap: 4px;
  }
  .account-track-item .btn-group-option {
    flex: none;
    min-width: 30px;
    padding: 5px 7px;
    font-size: 11px;
  }
  .account-track-del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .account-track-del:hover { color: var(--danger); }
  .account-delete-confirm {
    background: rgba(181, 84, 74, 0.1);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: -1px;
  }
  .account-delete-confirm p {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--text);
  }
  .account-delete-confirm-btns {
    display: flex;
    gap: 8px;
  }
  .account-delete-confirm-yes, .account-delete-confirm-cancel {
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .account-delete-confirm-yes { background: var(--danger); color: #fff; }
  .account-delete-confirm-cancel { background: var(--panel); color: var(--text-dim); border: 1px solid var(--panel-border); }
  .account-track-docs-btn {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .account-track-docs-btn:hover { color: var(--text); border-color: var(--accent); }
  .account-track-wrap { margin-bottom: 8px; }
  .account-track-wrap .account-track-item { margin-bottom: 0; }
  .account-docs-panel {
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 10px 12px;
    margin-top: -1px;
  }
  .account-docs-empty {
    color: var(--text-dim);
    font-size: 12.5px;
    margin: 0 0 8px;
  }
  .account-year-totals {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .account-year-block {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
  }
  .account-year-total {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 3px 8px;
  }
  .account-quarter-totals {
    font-size: 11px;
    color: var(--text-dim);
  }
  .account-doc-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--panel-border);
  }
  .account-doc-item:last-of-type { border-bottom: none; }
  .account-doc-info {
    flex: 1;
    min-width: 0;
  }
  .account-doc-link {
    display: block;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account-doc-link:hover { text-decoration: underline; }
  .account-doc-value {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .account-doc-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .account-doc-edit {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 11.5px;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
  }
  .account-doc-edit:hover { color: var(--text); border-color: var(--accent); }
  .account-doc-del {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .account-doc-del:hover { color: var(--danger); }
  .account-doc-edit-item {
    display: block;
    padding: 10px 0;
  }
  .account-doc-edit-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .account-doc-edit-row input[type="text"] {
    box-sizing: border-box;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .account-doc-edit-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .account-doc-edit-btns {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .account-doc-edit-save, .account-doc-edit-cancel {
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .account-doc-edit-save { background: var(--accent); color: #fff; }
  .account-doc-edit-cancel { background: var(--panel); color: var(--text-dim); border: 1px solid var(--panel-border); }
  .account-doc-add-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .account-doc-add-row input[type="text"] {
    box-sizing: border-box;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .account-doc-add-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .account-doc-period-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .account-doc-quarter-group {
    flex: 1;
    gap: 4px;
  }
  .account-doc-quarter-btn {
    flex: 1;
    min-width: 34px;
    padding: 6px 4px;
    font-size: 12px;
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
  }
  .account-doc-quarter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
    font-weight: 700;
  }
  .account-doc-year-select {
    flex-shrink: 0;
    width: 62px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    text-align: center;
  }
  .account-doc-year-select:focus { outline: none; border-color: var(--accent); }
  .account-doc-add-btn {
    width: 100%;
    margin-top: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .account-track-empty {
    color: var(--text-dim);
    font-size: 13px;
    padding: 6px 2px;
  }
  .account-status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    margin: 0 0 3px;
  }
  .due-date-row {
    display: flex;
    gap: 6px;
  }
  .due-date-row input[type="text"] {
    flex: 1;
    min-width: 0;
    box-sizing: border-box;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 8px;

  .due-date-row input[type="text"]:focus {

  .field-col { flex: 1; min-width: 130px; max-width: 100%; overflow: hidden; }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;

  .task {
    display: flex;

    gap: 10px;

    border-left: 3px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .task.prio-high { border-left-color: var(--high); background: linear-gradient(90deg, rgba(201, 86, 74, 0.08), var(--panel) 60px); }
  .task.prio-medium { border-left-color: var(--medium); background: linear-gradient(90deg, rgba(201, 149, 90, 0.08), var(--panel) 60px); }
  .task.prio-low { border-left-color: var(--low); background: linear-gradient(90deg, rgba(90, 143, 201, 0.08), var(--panel) 60px); }
  .task.done { opacity: 0.55; }
  .task .check {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--text-dim);
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .task.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task .check svg { display: none; width: 12px; height: 12px; }
  .task.done .check svg { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-text {
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
  }
  .task.done .task-text { text-decoration: line-through; color: var(--text-dim); }
  .task-meta {
    font-size: 12px;
    color: var(--overdue);
    margin-top: 3px;
  }
  .task-comment-wrap {
    margin-top: 8px;
  }
  .task-comment-text {
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 7px 10px;
    cursor: pointer;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .task-comment-text:hover { border-color: var(--accent); color: var(--text); }
  .task-comment-add {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 0;
    cursor: pointer;
  }
  .task-comment-add:hover { color: var(--accent); }
  .task-comment-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
  }
  .task-comment-input:focus { outline: none; }
  .task-comment-btns {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .task-comment-save, .task-comment-cancel {
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .task-comment-save { background: var(--accent); color: #fff; }
  .task-comment-cancel { background: var(--panel); color: var(--text-dim); border: 1px solid var(--panel-border); }
  .task-tags {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    flex-wrap: wrap;
  }
  .account-tag {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 2px 7px;
  }
  .prio-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-radius: 5px;
    padding: 2px 7px;
  }
  .prio-tag.prio-high { color: var(--high); background: rgba(201, 86, 74, 0.12); }
  .prio-tag.prio-medium { color: var(--medium); background: rgba(201, 149, 90, 0.12); }
  .prio-tag.prio-low { color: var(--low); background: rgba(90, 143, 201, 0.12); }
  .type-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-radius: 5px;
    padding: 2px 7px;
    border: 1px solid var(--panel-border);
  }
  .type-tag.type-internal { color: var(--internal-color); background: rgba(63, 160, 181, 0.12); }
  .type-tag.type-external { color: var(--external-color); background: rgba(154, 127, 201, 0.12); }
  .stakeholder-tag {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 2px 7px;
  }
  .due-tag {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 2px 7px;
  }
  .due-tag.overdue {
    color: var(--high);
    border-color: var(--high);
  }
  .task-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .task-undo {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 6px;
  }
  .task-undo:hover { color: var(--text); border-color: var(--accent); }
  .task-del {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .task-del:hover { color: var(--danger); }

  .empty {
    color: var(--text-dim);
    font-size: 14px;
    padding: 20px 4px;
    text-align: center;
  }

  .account-group {
    margin-bottom: 14px;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .account-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: var(--accent-dim);
    cursor: pointer;
    user-select: none;
  }
  .account-group-header.collapsed {
    border-bottom: none;
  }
  .account-group-header:not(.collapsed) {
    border-bottom: 1px solid var(--panel-border);
  }
  .account-group-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account-group-count {

    color: var(--text-dim);
    flex-shrink: 0;
  }
  .account-group-caret {
    color: var(--text-dim);
    flex-shrink: 0;
    font-size: 12px;
  }
  .account-group-body {
    padding: 8px;
  }
  .account-group-body .task {
    margin-bottom: 6px;
  }
  .account-group-body .task:last-child {
    margin-bottom: 0;
  }
  .unassigned-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 6px 0 8px;
  }

  .status {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 30px;
  }

  .filter-row {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
  }
  .filter-row select {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }

  .notes-section {
    margin-top: 22px;
  }
  #notesArea {
    width: 100%;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    min-height: 90px;
  }
  #notesArea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .notes-status {
    font-size: 11px;
    color: var(--text-dim);
    margin: 6px 0 0;
    min-height: 14px;
  }

  .history-block {
    margin-top: 34px;
    border-top: 1px solid var(--panel-border);
    padding-top: 18px;
  }
  .history-search-row input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 8px;

  }
  .history-search-row input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .history-item {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;

    margin-top: 8px;
  }
  .history-item .task-text {
    font-size: 14px;
    color: var(--text-dim);
  }
  .history-week {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .history-empty {
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 2px;
  }
  .history-week-header {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin: 16px 0 8px;
    padding: 8px 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .history-week-header:hover { border-color: var(--accent); }
  .history-week-header.collapsed {
    color: var(--text-dim);
    font-weight: 500;
  }
  .history-week-header::after {
    content: "\25BE";
    float: right;

  }
  .history-week-header.collapsed::after {
    content: "\25B8";
  }
  .history-week-header:first-child { margin-top: 8px; }
  .history-account-subheader {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 10px 0 4px 4px;
  }
  .history-date {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .history-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;

  .history-reopen {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 6px;
  }
  .history-reopen:hover { color: var(--text); border-color: var(--accent); }
  .history-del {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 6px;
  }
  .history-del:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

  @media (max-width: 480px) {
    body { padding: calc(16px + env(safe-area-inset-top)) 12px calc(60px + env(safe-area-inset-bottom)); }
    h1 { font-size: 19px; }
    .header-actions button { padding: 7px 9px; font-size: 11px; }
    .add-form { padding: 10px; }
    .task { padding: 11px; }
  }

  .sync-status {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
  }
  .sync-status.online::before { content: "\25cf "; color: var(--accent); }
  .sync-status.offline::before { content: "\25cf "; color: var(--danger); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <p class="week-label" id="weekLabel">Loading week...</p>
        <h1 id="pageTitle">This week's tasks</h1>
      </div>
      <div class="header-actions">
        <button type="button" id="exportBtn" title="Download a backup of all tasks">Export</button>
        <button type="button" id="importBtn" title="Load tasks from a backup file">Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;" />
      </div>
    </div>
    <div class="week-nav">
      <button type="button" id="prevWeekBtn" title="Previous week">&larr;</button>
      <span class="week-nav-label" id="weekNavLabel">This week</span>
      <button type="button" id="nextWeekBtn" title="Next week">&rarr;</button>
      <button type="button" id="todayBtn" title="Back to this week">Today</button>
    </div>
    <p class="week-summary" id="weekSummary"></p>
    <p class="sync-status" id="syncStatus">Connecting...</p>
  </header>

  <div class="add-form">
    <div class="add-row">
      <div class="field-col">
        <p class="field-label">Account</p>
        <input type="text" id="newAccountInput" placeholder="Optional" />
      </div>
      <div class="field-col">
        <p class="field-label">Stakeholder</p>
        <input type="text" id="newStakeholderInput" placeholder="Optional" />
      </div>
    </div>
    <div class="add-row">
      <input type="text" id="newTaskInput" placeholder="Add a task" />
    </div>
    <div class="add-row">
      <div class="field-col">
        <p class="field-label">Due date</p>
        <div class="due-date-row">
          <input type="text" id="dueMonthInput" placeholder="Month" autocomplete="off" />
          <input type="text" id="dueDayInput" placeholder="Day" autocomplete="off" inputmode="numeric" />
        </div>
      </div>
    </div>
    <div class="add-row">
      <div class="field-col">
        <p class="field-label">Priority</p>
        <div class="btn-group" id="priorityBtnGroup">
          <button type="button" class="btn-group-option prio-high" data-value="high" title="High">H</button>
          <button type="button" class="btn-group-option prio-medium" data-value="medium" title="Medium">M</button>
          <button type="button" class="btn-group-option prio-low" data-value="low" title="Low">L</button>
        </div>
        <input type="hidden" id="newPrioritySelect" value="" />
      </div>
      <div class="field-col">
        <p class="field-label">Type</p>
        <div class="btn-group" id="typeBtnGroup">
          <button type="button" class="btn-group-option type-internal" data-value="internal">Internal</button>
          <button type="button" class="btn-group-option type-external" data-value="external">External</button>
        </div>
        <input type="hidden" id="newTypeSelect" value="internal" />
      </div>
    </div>
    <div class="add-row">
      <button id="addBtn">Add</button>
    </div>
  </div>

  <div class="filter-row" id="filterRow" style="display:none;">
    <select id="accountFilter">
      <option value="">All accounts</option>
    </select>
    <select id="priorityFilter">
      <option value="">All priorities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
      <option value="none">No priority</option>
    </select>
  </div>

  <div id="taskList"></div>

  <div class="notes-section">
    <p class="section-title">Notes</p>
    <textarea id="notesArea" placeholder="Anything that doesn't need to be a task, context on a deal, a takeaway from a call, whatever you want to remember." rows="4"></textarea>
    <p class="notes-status" id="notesStatus"></p>
  </div>

  <div class="account-tracker-section">
    <div class="account-section-header">
      <p class="section-title" style="margin:0;">Accounts</p>
      <button type="button" id="exportAccountsBtn" title="Download accounts as an Excel file">Export Excel</button>
    </div>
    <div id="pipelineDashboard" class="pipeline-dashboard"></div>

    <div class="quarter-report-row">
      <span class="quarter-report-label">Report on:</span>
      <div class="btn-group" id="reportQuarterGroup">
        <button type="button" class="btn-group-option report-quarter-btn" data-value="1">Q1</button>
        <button type="button" class="btn-group-option report-quarter-btn" data-value="2">Q2</button>
        <button type="button" class="btn-group-option report-quarter-btn" data-value="3">Q3</button>
        <button type="button" class="btn-group-option report-quarter-btn" data-value="4">Q4</button>
      </div>
      <input type="text" inputmode="numeric" id="reportYearSelect" class="account-doc-year-select" maxlength="4" />
      <button type="button" id="exportQuarterReportBtn">Export</button>
    </div>

    <div class="account-add-row">
      <input type="text" id="newAccountTrackerInput" placeholder="Account name" />
      <div class="btn-group" id="accountStatusBtnGroup">
        <button type="button" class="btn-group-option status-won" data-value="won">Won</button>
        <button type="button" class="btn-group-option status-working" data-value="working">Working</button>
        <button type="button" class="btn-group-option status-lost" data-value="lost">Lost</button>
        <button type="button" class="btn-group-option status-stalled" data-value="stalled">Stalled</button>
      </div>
      <input type="hidden" id="newAccountTrackerStatus" value="working" />
      <button type="button" id="addAccountTrackerBtn">Add account</button>
    </div>
    <input type="text" id="accountSearchInput" class="account-search-input" placeholder="Search accounts" />
    <div id="accountTrackerList"></div>
    <div id="deletedAccountsPanel"></div>
  </div>

  <div class="history-block">
    <p class="section-title">Completed tasks</p>
    <div class="history-search-row">
      <input type="text" id="historySearch" placeholder="Filter by account, stakeholder, or keyword" />
    </div>
    <div id="historyResults"></div>
  </div>

  <p class="status" id="statusMsg"></p>
</div>

<script>
(function () {
  const listEl = document.getElementById('taskList');
  const weekLabel = document.getElementById('weekLabel');
  const weekSummary = document.getElementById('weekSummary');
  const weekNavLabel = document.getElementById('weekNavLabel');
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  const todayBtn = document.getElementById('todayBtn');
  const pageTitle = document.getElementById('pageTitle');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  const input = document.getElementById('newTaskInput');
  const accountInput = document.getElementById('newAccountInput');
  const stakeholderInput = document.getElementById('newStakeholderInput');
  const dueMonthInput = document.getElementById('dueMonthInput');
  const dueDayInput = document.getElementById('dueDayInput');

  const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  function parseMonthInput(text) {
    const raw = (text || '').trim().toLowerCase();
    if (!raw) return null;
    if (/^\d{1,2}$/.test(raw)) {
      const n = parseInt(raw, 10);
      return (n >= 1 && n <= 12) ? n : null;
    }
    const idx = monthNames.findIndex(m => m.startsWith(raw) || raw.startsWith(m));
    return idx >= 0 ? idx + 1 : null;
  }

  function parseDayInput(text) {
    const digits = (text || '').replace(/\D/g, '');
    if (!digits) return null;
    const n = parseInt(digits, 10);
    return (n >= 1 && n <= 31) ? n : null;
  }

  // Only month and day are picked, the year is figured out on its own:
  // whichever of this year or next year makes that date the next upcoming
  // one, since a due date almost never means a year from now.
  function resolveDueDate() {
    const month = parseMonthInput(dueMonthInput.value);
    const day = parseDayInput(dueDayInput.value);
    if (!month || !day) return '';
    const today = new Date();
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let d = new Date(today.getFullYear(), month - 1, day);
    if (d.getTime() < todayMidnight.getTime()) {
      d = new Date(today.getFullYear() + 1, month - 1, day);
    }
    return isoDate(d);
  }

  const prioritySelect = document.getElementById('newPrioritySelect');
  const typeSelect = document.getElementById('newTypeSelect');
  const priorityBtnGroup = document.getElementById('priorityBtnGroup');
  const typeBtnGroup = document.getElementById('typeBtnGroup');

  function setPriorityValue(v) {
    prioritySelect.value = v;
    priorityBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
      b.classList.toggle('active', b.dataset.value === v);
    });
  }
  function setTypeValue(v) {
    typeSelect.value = v;
    typeBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
      b.classList.toggle('active', b.dataset.value === v);
    });
  }
  priorityBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
    b.onclick = () => setPriorityValue(prioritySelect.value === b.dataset.value ? '' : b.dataset.value);
  });
  typeBtnGroup.querySelectorAll('.btn-group-option').forEach(b => {
    b.onclick = () => setTypeValue(typeSelect.value === b.dataset.value ? '' : b.dataset.value);
  });
  setPriorityValue('');
  setTypeValue('');
  const addBtn = document.getElementById('addBtn');
  const statusMsg = document.getElementById('statusMsg');
  const notesArea = document.getElementById('notesArea');
  const notesStatus = document.getElementById('notesStatus');
  const filterRow = document.getElementById('filterRow');
  const accountFilter = document.getElementById('accountFilter');
  const priorityFilter = document.getElementById('priorityFilter');
  const historySearch = document.getElementById('historyResults') ? document.getElementById('historySearch') : null;
  const historyResults = document.getElementById('historyResults');

  let tasks = [];
  let pendingCommentEdit = null; // task id currently showing the comment editor
  let collapsedAccounts = new Set();
  let expandedAccountDocs = new Set();
  let pendingDeleteAccountId = null;
  let editingDocIds = new Set();
  let activeAccountFilter = '';
  let activePriorityFilter = '';

  function mondayOf(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function isoDate(d) {
    return d.toISOString().slice(0, 10);
  }

  function fmtRange(mondayIso) {
    const start = new Date(mondayIso + 'T00:00:00');
    const end = new Date(start);
    end.setDate(end.getDate() + 4);
    const opts = { month: 'short', day: 'numeric' };
    return start.toLocaleDateString('en-US', opts) + ' - ' + end.toLocaleDateString('en-US', opts);
  }

  // Local fallback storage, used only if Firestore can't be reached.
  const localAdapter = {
    async get(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }

    async set(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (e) { return null; }
    }
  };

  async function loadTasks() {

  // Account tracker: a running list of accounts with a status, separate

  let accountsList = [];

  function activeAccounts() {

  // Anything sitting in the trash for more than 30 days is gone for good.
  // Runs every time accounts are loaded or synced in.
  function purgeOldDeletedAccounts() {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    const before = accountsList.length;
    accountsList = accountsList.filter(a => {
      if (!a.deleted) return true;
      if (!a.deletedAt) return true;
      return new Date(a.deletedAt + 'T00:00:00') >= cutoff;
    });
    return accountsList.length !== before;
  }

  async function loadAccounts() {
    const value = await localAdapter.get('accountsList');
    accountsList = value ? JSON.parse(value) : [];
    if (purgeOldDeletedAccounts()) await saveAccounts();

  async function saveAccounts() {
    await localAdapter.set('accountsList', JSON.stringify(accountsList));
    if (firestoreReady && accountsDocRef) {

        suppressNextAccountsRender = true;
        await accountsDocRef.set({

  function renderAccountsList() {
    renderPipelineDashboard();

    listEl.innerHTML = '';

      const empty = document.createElement('p');
      empty.className = 'account-track-empty';
      empty.textContent = 'No accounts tracked yet.';
      listEl.appendChild(empty);
      return;
    }
    const searchInput = document.getElementById('accountSearchInput');
    const q = searchInput ? searchInput.value.trim().toLowerCase() : '';
    let visible = active;
    if (q) {
      visible = active.filter(a => a.name.toLowerCase().includes(q));
    }
    if (visible.length === 0) {
      const none = document.createElement('p');
      none.className = 'account-track-empty';
      none.textContent = 'No accounts match that search.';
      listEl.appendChild(none);
      return;
    }
    const statusOrder = { won: 0, working: 1, lost: 2, stalled: 3 };
    const sorted = visible.slice().sort((a, b) => {
      const sa = statusOrder[a.status] ?? 4;
      const sb = statusOrder[b.status] ?? 4;
      if (sa !== sb) return sa - sb;
      return a.name.localeCompare(b.name);
    });
    sorted.forEach(acc => listEl.appendChild(renderAccountTrackItem(acc)));

  function accountYearTotal(acc, year) {
    return (acc.documents || [])
      .filter(d => getDocYear(d) === year)
      .reduce((sum, d) => sum + (Number(d.value) || 0), 0);
  }

  function formatMoney(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  function quarterOf(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    return Math.floor(d.getMonth() / 3) + 1;
  }

  // Prefer the quarter you explicitly picked when adding the project. Only
  // falls back to guessing from the entry date for older entries logged
  // before quarter selection existed.
  function getDocQuarter(doc) {
    if (doc.quarter) return doc.quarter;
    return quarterOf(doc.date);
  }
  function getDocYear(doc) {
    return doc.year || (doc.date ? new Date(doc.date + 'T00:00:00').getFullYear() : new Date().getFullYear());
  }
  function currentQuarter() {
    return Math.floor(new Date().getMonth() / 3) + 1;
  }

  function parseYearInput(text) {
    const n = parseInt((text || '').replace(/\D/g, ''), 10);
    return (n >= 2000 && n <= 2100) ? n : new Date().getFullYear();
  }

  // Marks "something happened here" on an account, resets the check-in clock.
  function touchAccountActivity(acc) {
    acc.lastActivityAt = isoDate(new Date());
  }

  // 45 days the first time, 60 days every time after that, never on Lost
  // accounts, and never if the person has switched it off for this account.
  function isAccountStale(acc) {
    if (acc.status === 'lost') return false;
    if (acc.remindersEnabled === false) return false;
    if (!acc.lastActivityAt) return false;
    const last = new Date(acc.lastActivityAt + 'T00:00:00');
    const daysSince = Math.floor((Date.now() - last.getTime()) / (1000 * 60 * 60 * 24));
    const threshold = acc.staleDismissed ? 60 : 45;
    return daysSince >= threshold;
  }

  function renderAccountTrackItem(acc) {
    const wrap = document.createElement('div');
    wrap.className = 'account-track-wrap';

    const row = document.createElement('div');
    row.className = 'account-track-item' + (acc.status ? ' status-' + acc.status : '');

    const name = document.createElement('div');
    name.className = 'account-track-name';
    name.textContent = acc.name;
    row.appendChild(name);

    if (isAccountStale(acc)) {
      const badge = document.createElement('button');
      badge.type = 'button';
      badge.className = 'account-stale-badge';
      badge.textContent = '!';
      const last = new Date(acc.lastActivityAt + 'T00:00:00');
      const daysSince = Math.floor((Date.now() - last.getTime()) / (1000 * 60 * 60 * 24));
      badge.title = 'No check-in logged in ' + daysSince + ' days. Tap once you have followed up.';
      badge.onclick = async (e) => {
        e.stopPropagation();
        acc.lastActivityAt = isoDate(new Date());
        acc.staleDismissed = true;
        await saveAccounts();
        renderAccountsList();
      };
      row.appendChild(badge);
    }

    const docCount = (acc.documents || []).length;
    const docsBtn = document.createElement('button');
    docsBtn.type = 'button';
    docsBtn.className = 'account-track-docs-btn';
    docsBtn.textContent = 'Docs' + (docCount ? ' (' + docCount + ')' : '');
    docsBtn.onclick = () => {
      if (expandedAccountDocs.has(acc.id)) {
        expandedAccountDocs.delete(acc.id);
      } else {
        expandedAccountDocs.add(acc.id);
      }
      renderAccountsList();
    };
    row.appendChild(docsBtn);

    const statusGroup = document.createElement('div');
    statusGroup.className = 'btn-group';
    ['won', 'working', 'lost', 'stalled'].forEach(statusVal => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-group-option status-' + statusVal + (acc.status === statusVal ? ' active' : '');
      btn.textContent = statusVal.charAt(0).toUpperCase();
      btn.title = statusVal.charAt(0).toUpperCase() + statusVal.slice(1);
      btn.onclick = async () => {
        acc.status = (acc.status === statusVal) ? '' : statusVal;
        touchAccountActivity(acc);
        await saveAccounts();
        renderAccountsList();
        render();
      };
      statusGroup.appendChild(btn);
    });
    row.appendChild(statusGroup);

    const del = document.createElement('button');
    del.className = 'account-track-del';
    del.textContent = '\u00d7';
    del.onclick = () => {
      pendingDeleteAccountId = acc.id;
      renderAccountsList();
    };
    row.appendChild(del);

    wrap.appendChild(row);

    if (pendingDeleteAccountId === acc.id) {
      const confirmBox = document.createElement('div');
      confirmBox.className = 'account-delete-confirm';

      const docCount = (acc.documents || []).length;
      const msg = document.createElement('p');
      msg.textContent = docCount > 0
        ? 'Delete ' + acc.name + '? This also moves ' + docCount + ' tracked project' + (docCount === 1 ? '' : 's') + ' with it. It\'ll sit in Recently Deleted for 30 days in case you need it back.'
        : 'Delete ' + acc.name + '? It\'ll sit in Recently Deleted for 30 days in case you need it back.';
      confirmBox.appendChild(msg);

      const btnRow = document.createElement('div');
      btnRow.className = 'account-delete-confirm-btns';

      const yesBtn = document.createElement('button');
      yesBtn.className = 'account-delete-confirm-yes';
      yesBtn.textContent = 'Yes, delete';
      yesBtn.onclick = async () => {
        acc.deleted = true;
        acc.deletedAt = isoDate(new Date());
        pendingDeleteAccountId = null;
        await saveAccounts();
        renderAccountsList();
        render();
      };
      btnRow.appendChild(yesBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'account-delete-confirm-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => {
        pendingDeleteAccountId = null;
        renderAccountsList();
      };
      btnRow.appendChild(cancelBtn);

      confirmBox.appendChild(btnRow);
      wrap.appendChild(confirmBox);
    }

    const currentYearTotal = accountYearTotal(acc, new Date().getFullYear());
    const allTimeTotal = (acc.documents || []).reduce((sum, d) => sum + (Number(d.value) || 0), 0);
    if (allTimeTotal > 0) {
      const valueRow = document.createElement('div');
      valueRow.className = 'account-track-value-row';
      valueRow.textContent = formatMoney(currentYearTotal) + ' YTD \u00b7 ' + formatMoney(allTimeTotal) + ' all-time';
      wrap.appendChild(valueRow);
    }

    if (expandedAccountDocs.has(acc.id)) {
      wrap.appendChild(renderAccountDocsPanel(acc));
    }

    return wrap;
  }

  function normalizeUrl(url) {
    const trimmed = url.trim();
    if (!trimmed) return '';
    return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
  }

  function renderDocItem(acc, doc) {
    if (editingDocIds.has(doc.id)) {
      return renderDocEditForm(acc, doc);
    }

    const item = document.createElement('div');
    item.className = 'account-doc-item';

    const info = document.createElement('div');

      valEl.className = 'account-doc-value';
      const q = getDocQuarter(doc);
      const y = getDocYear(doc);

      info.appendChild(valEl);

    editDoc.onclick = () => {
      editingDocIds.add(doc.id);

    const delDoc = document.createElement('button');
    delDoc.className = 'account-doc-del';
    delDoc.textContent = '\u00d7';
    delDoc.onclick = async () => {
      acc.documents = (acc.documents || []).filter(d => d.id !== doc.id);
      await saveAccounts();
